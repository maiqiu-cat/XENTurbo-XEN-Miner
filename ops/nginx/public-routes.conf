# Candidate HTTPS-server location rules for the SEO release.
# Replace the existing index/assets/catch-all locations, do not append duplicate locations.
# Review against the live vhost, back up first, and run nginx -t before activation.
# Keep the existing root, TLS, HTTP redirect and security-headers include unchanged.
error_page 404 /404.html;

location = / {
    try_files /index.html =404;
    include /etc/nginx/snippets/xenturbo-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location = /index.html {
    return 301 /$is_args$args;
}
location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
    include /etc/nginx/snippets/xenturbo-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
    include /etc/nginx/snippets/xenturbo-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location = /docs { return 301 /docs/en/$is_args$args; }
location = /docs/ { return 301 /docs/en/$is_args$args; }
location ^~ /docs/ {
    # Test the original URI so internal directory-index redirects never loop.
    if ($request_uri ~ "^(/docs/(?:en|zh-hant)/(?:operations/|rpc-and-pending/|security/|versions/)?)index\.html(?:\?|$)") {
        return 301 $1$is_args$args;
    }
    rewrite ^/docs/(en|zh-hant)$ /docs/$1/ permanent;
    rewrite ^/docs/(en|zh-hant)/(operations|rpc-and-pending|security|versions)$ /docs/$1/$2/ permanent;
    if ($uri !~ "^/docs/(en|zh-hant)/(?:(operations|rpc-and-pending|security|versions)/)?(?:index\.html)?$") {
        return 404;
    }
    index index.html;
    try_files $uri $uri/ =404;
    include /etc/nginx/snippets/xenturbo-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location ^~ /site-assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/xenturbo-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/xenturbo-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
}
location = /404.html {
    internal;
    include /etc/nginx/snippets/xenturbo-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
}
location / { return 404; }
